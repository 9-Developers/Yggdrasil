name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

jobs:
  java:
    name: Java
    runs-on: node24
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: https://github.com/actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build
        run: ./gradlew build

  web:
    name: Web
    runs-on: freebsd-15.1
    timeout-minutes: 20
    steps:
      - name: Install workflow prerequisites
        run: |
          env ASSUME_ALWAYS_YES=yes pkg bootstrap -f
          pkg install -y bash git node24 npm-node24

      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build
