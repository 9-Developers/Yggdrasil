name: Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  java:
    name: Java build
    runs-on: node24
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: https://github.com/actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build
        run: ./gradlew build --no-daemon

  web:
    name: Web build
    runs-on: node24
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

  socket:
    name: Socket
    if: ${{ forgejo.event_name == 'push' || forgejo.event.pull_request.head.repo.full_name == forgejo.repository }}
    runs-on: node24
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: https://github.com/actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Enable pnpm
        run: corepack enable

      - name: Scan dependencies
        run: pnpm dlx socket@1.1.146 ci --auto-manifest
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}

  trivy:
    name: Trivy
    runs-on: node24
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Scan repository
        uses: docker://docker.io/aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f # 0.72.0
        with:
          args: >-
            fs
            --exit-code 1
            --severity HIGH,CRITICAL
            --scanners vuln,secret,misconfig
            ${{ forgejo.workspace }}

  semgrep:
    name: Semgrep
    runs-on: node24
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Scan source
        uses: docker://docker.io/semgrep/semgrep@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b # 1.172.0
        with:
          args: >-
            scan
            --config auto
            --severity ERROR
            --error
            ${{ forgejo.workspace }}
