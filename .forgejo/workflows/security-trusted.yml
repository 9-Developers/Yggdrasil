name: Security (Trusted)

on:
  push:
    branches:
      - main
  workflow_call:

jobs:
  semgrep:
    name: Semgrep
    runs-on: node24
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Scan source
        uses: docker://docker.io/semgrep/semgrep@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b # 1.172.0
        with:
          args: >-
            semgrep
            scan
            --config auto
            --severity ERROR
            --error
            ${{ forgejo.workspace }}

  socket:
    name: Socket
    runs-on: node24
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Scan dependencies
        run: npx --yes socket@1.1.146 ci --org 9-developers
        env:
          SOCKET_SECURITY_API_TOKEN: ${{ secrets.SOCKET_SECURITY_API_KEY }}

  trivy:
    name: Trivy
    runs-on: node24
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Scan repository
        uses: docker://docker.io/aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f # 0.72.0
        with:
          args: >-
            fs
            --exit-code 1
            --severity HIGH,CRITICAL
            --scanners vuln,secret,misconfig
            ${{ forgejo.workspace }}
