[versions]
# Plugins
axion = "1.21.2"
jreleaser = "1.25.0"
run-paper = "3.0.2"
# Libraries
evo-inflector = "2.0"
jackson = "3.1.1"
jakarta = "4.0.0"
jakarta-inject = "2.0.1"
jakarta-json = "2.1.3"
jakarta-validations-api = "3.1.1"
jersey = "4.0.2"
jspecify = "1.0.0"
junit = "6.0.1"
mongo = "5.6.4"
paper = "26.1.2.build.74-stable"
reactor = "2025.0.4"
slf4j = "2.0.17"
sqlite = "3.51.3.0"

[libraries]
# Plugins
axion = { group = "pl.allegro.tech.build.axion-release", name = "pl.allegro.tech.build.axion-release.gradle.plugin", version.ref = "axion" }
jreleaser = { group = "org.jreleaser", name = "org.jreleaser.gradle.plugin", version.ref = "jreleaser" }
run-paper = { group = "xyz.jpenilla.run-paper", name = "xyz.jpenilla.run-paper.gradle.plugin", version.ref = "run-paper" }

# Libraries
evo-inflector = { group = "org.atteo", name = "evo-inflector", version.ref = "evo-inflector" }
jackson-bom = { group = "tools.jackson", name = "jackson-bom", version.ref = "jackson" }
jackson-core = { group = "tools.jackson.core", name = "jackson-core" }
jackson-databind = { group = "tools.jackson.core", name = "jackson-databind" }
jakarta = { group = "jakarta.ws.rs", name = "jakarta.ws.rs-api", version.ref = "jakarta" }
jakarta-inject = { group = "jakarta.inject", name = "jakarta.inject-api", version.ref = "jakarta-inject" }
jakarta-json = { group = "jakarta.json", name = "jakarta.json-api", version.ref = "jakarta-json" }
jakarta-validations-api = { group = "jakarta.validation", name = "jakarta.validation-api", version.ref = "jakarta-validations-api" }
jersey-bom = { group = "org.glassfish.jersey", name = "jersey-bom", version.ref = "jersey" }
jersey-container-grizzly = { group = "org.glassfish.jersey.containers", name = "jersey-container-grizzly2-http" }
jersey-hk2 = { group = "org.glassfish.jersey.inject", name = "jersey-hk2" }
jersey-json = { group = "org.glassfish.jersey.media", name = "jersey-media-json-jackson" }
jersey-server = { group = "org.glassfish.jersey.core", name = "jersey-server" }
jspecify = { group = "org.jspecify", name = "jspecify", version.ref = "jspecify" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
mongo-bom = { group = "org.mongodb", name = "mongodb-driver-bom", version.ref = "mongo" }
mongo-driver = { group = "org.mongodb", name = "mongodb-driver-reactivestreams" }
paper-api = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper" }
reactor-bom = { group = "io.projectreactor", name = "reactor-bom", version.ref = "reactor" }
reactor-core = { group = "io.projectreactor", name = "reactor-core" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
sqlite = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite" }

[bundles]
jackson = ["jackson-core", "jackson-databind"]
jakarta = ["jakarta", "jakarta-inject", "jakarta-json", "jakarta-validations-api"]
jersey = ["jersey-container-grizzly", "jersey-hk2", "jersey-json", "jersey-server"]
junit = ["junit-platform-engine", "junit-platform-launcher"]
