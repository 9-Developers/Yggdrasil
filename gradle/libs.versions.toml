[versions]
axion = "1.18.18"
grizzly = "4.0.2"
jackson = "3.0.3"
jakarta = "4.0.0"
jakarta-json = "2.1.3"
jersey = "4.0.0"
jspecify = "1.0.0"
junit = "6.0.1"
paper = "1.21.11-rc3-R0.1-SNAPSHOT"
slf4j = "2.0.17"

[libraries]
grizzly-http-server = { module = "org.glassfish.grizzly:grizzly-http-server", version.ref = "grizzly" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
jackson-core = { module = "tools.jackson.core:jackson-core" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jakarta = { module = "jakarta.ws.rs:jakarta.ws.rs-api", version.ref = "jakarta" }
jakarta-json = { module = "jakarta.json:jakarta.json-api", version.ref = "jakarta-json" }
jersey-grizzly-server = { module = "org.glassfish.jersey.containers:jersey-container-grizzly2-http", version.ref = "jersey" }
jersey-json = { module = "org.glassfish.jersey.media:jersey-media-json-jackson", version.ref = "jersey" }
jersey-server = { module = "org.glassfish.jersey.core:jersey-server", version.ref = "jersey" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

[bundles]
jackson = ["jackson-core", "jackson-databind"]
jakarta = ["jakarta", "jakarta-json"]
jersey = ["jersey-grizzly-server", "jersey-json", "jersey-server"]

[plugins]
axion = { id = "pl.allegro.tech.build.axion-release", version.ref = "axion" }
