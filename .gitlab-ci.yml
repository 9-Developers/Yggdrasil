include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - test
  - release

# Check job
check:
  image: eclipse-temurin:21

  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

  script:
    - ./gradlew check

  stage: test

# Build job
build:
  artifacts:
    paths:
      - web-server-api/build/libs
      - web-server-plugin/build/libs
    reports:
      dotenv: variables.env

  image: eclipse-temurin:21

  rules:
    - if: $CI_COMMIT_TAG =~ /^(?:api|plugin)-[0-9]+.[0-9]+.[0-9]+$/

  script:
    - echo "API_VERSION=$(./gradlew web-server-api:currentVersion | awk -F ':' '$1 ~ /Project version/ { gsub(/ /, "", $2); print($2) }')" >> variables.env
    - echo "PKG_REGISTRY_URL=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic" >> variables.env
    - echo "PLUGIN_VERSION=$(./gradlew web-server-plugin:currentVersion | awk -F ':' '$1 ~ /Project version/ { gsub(/ /, "", $2); print($2) }')" >> variables.env
    - ./gradlew build

  stage: release

# Publish API job
publish-api:
  image: eclipse-temurin:21

  rules:
    - if: $CI_COMMIT_TAG =~ /^api-[0-9]+.[0-9]+.[0-9]+$/

  script:
    - ./gradlew web-server-api:jreleaserFullRelease

  stage: release

  variables:
    JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME }}
    JRELEASER_MAVENCENTRAL_SONATYPE_TOKEN: ${{ JRELEASER_MAVENCENTRAL_SONATYPE_TOKEN }}
    JRELEASER_GPG_PASSPHRASE: ${{ JRELEASER_GPG_PASSPHRASE }}
    JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
    JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}

# Release API job
release-api:
  image: registry.gitlab.com/gitlab-org/release-cli:latest

  needs:
    - job: build
      artifacts: true
    - job: upload-api

  release:
    name: "9craft Web Server API - $API_VERSION"
    tag_name: "$CI_COMMIT_TAG"
    description: "9craft Web Server API $API_VERSION"
    ref: "$CI_COMMIT_SHA"
    assets:
      links:
        - name: "9craft-web-server-api-${API_VERSION}.jar"
          url: "${PKG_REGISTRY_URL}/9craft-web-server-api/${API_VERSION}/9craft-web-server-api-${API_VERSION}.jar"
        - name: "9craft-web-server-api-${API_VERSION}-javadoc.jar"
          url: "${PKG_REGISTRY_URL}/9craft-web-server-api/${API_VERSION}/9craft-web-server-api-${API_VERSION}-javadoc.jar"
        - name: "9craft-web-server-api-${API_VERSION}-sources.jar"
          url: "${PKG_REGISTRY_URL}/9craft-web-server-api/${API_VERSION}/9craft-web-server-api-${API_VERSION}-sources.jar"

  rules:
    - if: $CI_COMMIT_TAG =~ /^api-[0-9]+.[0-9]+.[0-9]+$/

  # Script is required for pipeline jobs
  script:
    - echo "Creating release $API_VERSION"

  stage: release

# Release plugin job
release-plugin:
  image: registry.gitlab.com/gitlab-org/release-cli:latest

  needs:
    - job: build
      artifacts: true
    - job: upload-plugin

  release:
    name: "9craft Web Server - $PLUGIN_VERSION"
    tag_name: "$CI_COMMIT_TAG"
    description: "9craft Web Server $PLUGIN_VERSION"
    ref: "$CI_COMMIT_SHA"
    assets:
      links:
        - name: "9craft-web-server-${PLUGIN_VERSION}.jar"
          url: "${PKG_REGISTRY_URL}/9craft-web-server/${PLUGIN_VERSION}/9craft-web-server-${PLUGIN_VERSION}.jar"

  rules:
    - if: $CI_COMMIT_TAG =~ /^plugin-[0-9]+.[0-9]+.[0-9]+$/

  # Script is required for pipeline jobs
  script:
    - echo "Creating release $API_VERSION"

  stage: release

# Upload API job
upload-api:
  image: curlimages/curl:latest

  needs:
    - job: build
      artifacts: true

  rules:
    - if: $CI_COMMIT_TAG =~ /^api-[0-9]+.[0-9]+.[0-9]+$/

  script:
    - ls -la .
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
      --upload-file web-server-api/build/libs/9craft-web-server-api-${API_VERSION}.jar \
      ${PKG_REGISTRY_URL}/9craft-web-server-api/${API_VERSION}/9craft-web-server-api-${API_VERSION}.jar
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
      --upload-file web-server-api/build/libs/9craft-web-server-api-${API_VERSION}-javadoc.jar \
      ${PKG_REGISTRY_URL}/9craft-web-server-api/${API_VERSION}/9craft-web-server-api-${API_VERSION}-javadoc.jar
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
      --upload-file web-server-api/build/libs/9craft-web-server-api-${API_VERSION}-sources.jar \
      ${PKG_REGISTRY_URL}/9craft-web-server-api/${API_VERSION}/9craft-web-server-api-${API_VERSION}-sources.jar 

  stage: release

# Upload plugin job
upload-plugin:
  image: curlimages/curl:latest

  needs:
    - job: build
      artifacts: true

  rules:
    - if: $CI_COMMIT_TAG =~ /^plugin-[0-9]+.[0-9]+.[0-9]+$/

  script:
    - ls -la .
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
      --upload-file web-server-plugin/build/libs/9craft-web-server-${PLUGIN]_VERSION}.jar \
      ${PKG_REGISTRY_URL}/9craft-web-server/${PLUGIN_VERSION}/9craft-web-server-${PLUGIN_VERSION}.jar 

  stage: release
