name: 9craft Web Server
version: '$version'

main: tech.ninecraft.server.WebServerPlugin
description: >-
  Utility plugin which provides a web server allowing other plugins to provide REST APIs, HTTP endpoints, or Websockets.
api-version: '26.1.2'
load: STARTUP

authors:
  - Ryan Porterfield
website: https://www.9craft.tech

dependencies:
  server:
    9craft Data:
      load: BEFORE
      required: false
      join-classpath: true

libraries:
  - tools.jackson.core:jackson-core:3.1.1
  - tools.jackson.core:jackson-databind:3.1.1
  - jakarta.ws.rs:jakarta.ws.rs-api:4.0.0
  - jakarta.json:jakarta.json-api:2.1.3
  - jakarta.validation:jakarta.validation-api:3.1.1
  - org.glassfish.jersey.media:jersey-media-json-jackson:4.0.0
  - org.glassfish.jersey.containers:jersey-container-grizzly2-http:4.0.0
  - org.glassfish.jersey.containers:jersey-container-grizzly2-servlet:4.0.0
  - org.glassfish.jersey.inject:jersey-hk2:4.0.0
  - org.glassfish.jersey.core:jersey-server:4.0.0
  - org.jspecify:jspecify:1.0.0
